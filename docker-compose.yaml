services:
  storyteller-backend:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        - PORT=5001
    container_name: storyteller-backend
    env_file:
      - ./backend/.env
    environment:
      OPENAI_API_KEY_FILE: /run/secrets/openai_api_key
      GEMINI_API_KEY_FILE: /run/secrets/gemini_api_key
      PORT: 5001
    volumes:
      - ./backend:/app/backend
    secrets:
      - openai_api_key
      - gemini_api_key
    networks:
      - intranet
    restart: unless-stopped

  storyteller-frontend:
    image: nginx:1.27-alpine
    container_name: storyteller-frontend
    depends_on:
      - storyteller-backend
    volumes:
      - ./frontend:/usr/share/nginx/html:ro
      - ./frontend/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    labels:
      - "traefik.enable=true"
      - "traefik.docker.network=internet"
      - "traefik.http.routers.storyteller.rule=Host(`${TRAEFIK_DOMAIN:?TRAEFIK_DOMAIN must be set in .env}`)"
      - "traefik.http.routers.storyteller.entrypoints=web"
      - "traefik.http.routers.storyteller.tls=false"
      - "traefik.http.routers.storyteller.service=storyteller"
      - "traefik.http.services.storyteller.loadbalancer.server.port=80"
    networks:
      - internet
      - intranet
    restart: unless-stopped

networks:
  internet:
    external: true
  intranet:
    name: storyteller-intranet
    internal: true

secrets:
  openai_api_key:
    file: ./secrets/openai_api_key
  gemini_api_key:
    file: ./secrets/gemini_api_key
