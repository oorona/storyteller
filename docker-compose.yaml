services:
  backend:
    build:
      context: . # Use the current directory as the build context
      dockerfile: Dockerfile # Specify the Dockerfile name
      args: # Optional: Pass build-time arguments to Dockerfile
        - PORT=5001 # Matches default in Dockerfile and app
    container_name: ai_story_generator_backend
    # Load environment variables directly from the .env file located in ./backend
    # This is crucial for injecting the API key without baking it into the image.
    env_file:
      - ./backend/.env
    ports:
      # Map host port 5001 to container port 5001 (or the value of $PORT if changed)
      - "${PORT:-5001}:${PORT:-5001}" # Uses host's PORT env var or defaults to 5001
    volumes:
      # Optional: Mount the backend code for development (live reloading if Flask debug is on)
      # Comment out for production-like deployment where you rebuild the image for changes.
      - ./backend:/app/backend
    restart: unless-stopped # Or 'always' depending on your needs

# Optional: Define networks if needed for linking multiple services
# networks:
#   app_network:
#     driver: bridge

# Optional: Define volumes if needed for persistent data (not required for this app V1)
# volumes:
#   my_data: